name: dating_app
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.4.0

  # Secure token storage
  flutter_secure_storage: ^11.2.0

  # Navigation
  go_router: ^18.0.2

  # State management
  flutter_riverpod: ^2.5.0

  # Image handling
  cached_network_image: ^4.0.3
  image_picker: ^1.0.7

  # Real-time chat
  socket_io_client: ^3.1.6

  # Local storage
  shared_preferences: ^2.2.2

  # Icons
  cupertino_icons: ^2.0.0
  
  camera: ^0.12.1

  supabase_flutter: ^2.3.0

  google_sign_in: ^6.2.1

  # Device location for discovery ("Near you") + onboarding location step
  geolocator: ^14.1.1
  maplibre_gl: ^0.27.1
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  firebase_crashlytics: ^5.3.0
  firebase_analytics: ^12.5.0
  firebase_remote_config: ^6.6.0
  flutter_screenutil: ^5.9.3
  logger: ^2.7.0
  package_info_plus: ^10.2.1
  cloud_firestore: ^6.9.0
  flutter_local_notifications: ^22.3.0

  # The device's IANA timezone (e.g. "Asia/Kolkata"), sent with the FCM token
  # so the backend evaluates quiet hours where the user is rather than on the
  # server. Dart's own `timeZoneName` yields an abbreviation ("IST"), which is
  # ambiguous and unusable for a zone lookup — hence the plugin.
  flutter_timezone: ^5.1.0
  font_awesome_flutter: ^11.0.0
  flutter_svg: ^2.3.0
  syncfusion_flutter_pdfviewer: ^35.1.37
  webview_flutter: ^4.14.1
  dropdown_button2: ^3.1.0
  dotted_border: ^3.1.0
  url_launcher: ^6.3.2
  pub_semver: ^2.2.0
  flutter_dotenv: ^6.0.1
  flutter_launcher_icons: ^0.14.4
  google_mobile_ads: ^9.1.0
  equatable: ^2.1.0
  in_app_purchase: ^3.3.0
  intl: ^0.20.3
  freerasp: ^8.2.2
  safe_device: ^1.4.1
  connectivity_plus: ^7.3.1
  purchases_flutter: ^10.13.1
  pinput: ^6.0.2
  smart_auth: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Testing the data layer without a live server
  mocktail: ^1.0.4
  http_mock_adapter: ^0.6.1
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/launcher_icon.png"
  min_sdk_android: 21

  web:
    generate: true
    image_path: "assets/icons/launcher_icon.png"
#    background_color: "#ffffff"   # ✅ FIXED
#    theme_color: "#ffffff"        # ✅ FIXED

flutter:
  uses-material-design: true

  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf

  assets:
    - assets/images/
    - assets/vectors/svg/
    - assets/icons/
    - assets/map/
    - .env